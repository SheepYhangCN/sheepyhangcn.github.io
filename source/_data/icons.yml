# =============================================================
# 站点私有图标（覆盖 / 补充主题 _data/icons.yml）
# -------------------------------------------------------------
# 该文件由主题 scripts/events/lib/config.js 读取，与主题 _data/icons.yml
# 做简单覆盖合并（同名键以本文件为准），因此不会进入主题仓库。
#
# 键格式：namespace:icon-name
# 使用方式：
#   模板 / 标签脚本：icon('social:github') 或 ctx.utils.icon('social:github')
#   配置项：     icon: social:github
#
# 注意：配置项里的 icon 值必须是「图标键」或 URL 或 <img> 标签。
#       不要直接写内联 <svg>，否则 icon() 会把它当作图标键生成
#       <svg class="icon" data-icon="<svg ...">占位符</svg>，
#       属性被 HTML 解析器拆散且无法被 /js/icons.js 替换。
# =============================================================

